<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Level Up Expo · Career Events</title><style>body{margin:0;background:#091827;color:#e9f3ff;font:16px system-ui}main{max-width:1050px;margin:auto;padding:28px}h1{font-size:2rem}section{background:#142b40;border:1px solid #36516b;border-radius:16px;padding:20px;margin:16px 0}input,select,button{font:inherit;padding:11px;border-radius:9px;margin:5px;border:1px solid #6e8aa4}input,select{background:#fff;color:#102338}button,.link{background:#e3aa39;color:#13243a;font-weight:700;cursor:pointer}.link{display:inline-block;padding:11px;border-radius:9px;text-decoration:none}label{display:block;margin:9px 0}.muted{color:#bad0e3}article{padding:14px;border:1px solid #54708a;border-radius:10px;margin:10px 0}a{color:#8ed7ff}#msg{white-space:pre-wrap}</style></head><body><main><a href="../career-tree-next/">← Career Tree</a><h1>LEVEL UP · VIRTUAL CAREER EXPO</h1><p>Discover employers, explore opportunities, and connect with recruiters at upcoming virtual career events.</p><section><h2>Upcoming events</h2><p class="muted">Sign in to see published events. Public guest registration and immersive lobby access are being developed.</p><label>Email <input type="email" id="email" placeholder="Your email address"></label><button id="signin">Email sign-in link</button><button id="signout">Sign out</button><p id="identity"></p><div id="events"></div></section><p id="msg" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.81.1/dist/umd/supabase.min.js"></script><script>const sb=window.supabase.createClient('https://dnijrzotfyvmmnmueknk.supabase.co','sb_publishable_qSEo4iczJBozMaSIvTKisw_BsJy-iPc');
const $=id=>document.getElementById(id),say=t=>$('msg').textContent=t;let user=null;
const INVITE_KEY='levelup-expo-pending-invite-v1';const incomingInvite=new URLSearchParams(location.search).get('invite');if(incomingInvite&&/^[a-f0-9]{64}$/.test(incomingInvite))localStorage.setItem(INVITE_KEY,incomingInvite);
$('signin').onclick=async()=>{if(!$('email').value.trim())return say('Enter an email.');const {error}=await sb.auth.signInWithOtp({email:$('email').value.trim(),options:{emailRedirectTo:location.origin+location.pathname+(localStorage.getItem(INVITE_KEY)?'?invite='+encodeURIComponent(localStorage.getItem(INVITE_KEY)):'')}});say(error?error.message:'Check your email for the sign-in link.')};
$('signout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function init(){const {data:{user:u}}=await sb.auth.getUser();user=u;const invite=new URLSearchParams(location.search).get('invite')||localStorage.getItem(INVITE_KEY);$('identity').textContent=user?'Signed in as '+user.email:'Sign in to view events.';if(!user){if(invite)say('Sign in with your existing Level Up account to accept this coach invitation.');return;}if(invite){try{const {data:{session}}=await sb.auth.getSession();const res=await fetch('https://dnijrzotfyvmmnmueknk.supabase.co/functions/v1/levelup-expo-invitations',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action:'accept',token:invite})});const answer=await res.json();if(!res.ok)throw Error(answer.error||'Invitation could not be accepted');localStorage.removeItem(INVITE_KEY);history.replaceState(null,'',location.pathname);say('Coach invitation verified and registration confirmed.');}catch(e){say(e.message)}}const {data,error}=await sb.from('expo_events').select('id,title,slug,starts_at,ends_at,status,timezone').in('status',['registration','lobby','live','closed']).order('starts_at',{ascending:true});if(error)return say(error.message);const {data:existing,error:regError}=await sb.from('expo_registrations').select('event_id').eq('user_id',user.id);if(regError)return say(regError.message);const registered=new Set((existing||[]).map(r=>r.event_id));const root=$('events');root.replaceChildren();const filter=new URLSearchParams(location.search).get('event');const shown=filter?data.filter(e=>e.slug===filter):data;if(!shown.length)root.textContent='No published events are currently available.';for(const e of shown){const card=document.createElement('article');const h=document.createElement('h3');h.textContent=e.title;const p=document.createElement('p');p.textContent=new Date(e.starts_at).toLocaleString()+' · '+e.status;card.append(h,p);const b=document.createElement('button');b.textContent=registered.has(e.id)?'Registered ✓':'Register for event';b.disabled=registered.has(e.id)||!['registration','lobby','live'].includes(e.status);b.onclick=async()=>{b.disabled=true;const {error}=await sb.from('expo_registrations').insert({event_id:e.id,user_id:user.id});if(!error||error.code==='23505'){registered.add(e.id);b.textContent='Registered ✓';say('Registration confirmed for '+e.title+'. The immersive lobby is not yet connected.')}else{b.disabled=false;say(error.message)}};card.append(b);root.append(card)}}
sb.auth.onAuthStateChange(()=>setTimeout(init,0));init();
</script></body></html>

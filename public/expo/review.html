<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Level Up · Expo Booth Review</title><style>:root{font:16px system-ui;background:#071b2d;color:#f0f8ff}*{box-sizing:border-box}body{margin:0}header{background:#12344f;padding:22px 5%;border-bottom:1px solid #4c86a6}main{max-width:1250px;margin:32px auto;padding:0 20px}h1{font-size:clamp(26px,4vw,42px)}.muted{color:#c0d9e8}.card{background:#14344e;border:1px solid #4c7591;border-radius:16px;padding:22px;margin:18px 0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.version{background:#0c253c;padding:20px;border-radius:12px;border:1px solid #416e8a;min-width:0}.sign{padding:16px;background:#102c42;border:3px solid var(--accent,#62caff);border-radius:12px;text-align:center;margin:15px 0}.sign img{display:block;max-width:120px;max-height:90px;object-fit:contain;background:#fff;padding:7px;margin:0 auto 12px}.tag{color:#9be6ff;font-size:12px;font-weight:900;letter-spacing:.1em}button{background:#edb443;color:#10283b;font-weight:900;padding:12px 18px;border:0;border-radius:9px;cursor:pointer}button.secondary{background:#315b78;color:white}button:disabled{opacity:.5}input,textarea{font:inherit;padding:12px;border-radius:8px;border:1px solid #9eb7ca;background:#f7fbff;color:#092439}input{width:min(350px,100%)}textarea{width:100%;min-height:75px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.status{min-height:25px;color:#aaf0d6}.empty{padding:28px;border:1px dashed #628ca7;border-radius:12px}@media(max-width:700px){.cols{grid-template-columns:1fr}}</style></head><body><header><strong>LEVEL UP · FACILITATOR EXPO MANAGER</strong> · Booth Branding Review</header><main><h1>Review employer booth designs</h1><p class="muted">Compare submitted customization with the currently published booth. Only authorized Level Up staff can approve or return designs.</p><div class="card" id="signin"><h2>Staff sign-in</h2><p class="muted">Use your authorized Level Up staff account.</p><input type="email" id="email" placeholder="Staff email address"> <button id="login">Send sign-in link</button></div><p id="message" class="status" role="status"></p><div id="queue"></div><button class="secondary" id="refresh">Refresh review queue</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.81.1/dist/umd/supabase.min.js"></script><script>
const sb=window.supabase.createClient('https://dnijrzotfyvmmnmueknk.supabase.co','sb_publishable_qSEo4iczJBozMaSIvTKisw_BsJy-iPc'),$=id=>document.getElementById(id);let busy=false;
function say(s){$('message').textContent=s}function node(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function logo(s){try{const u=new URL(s);return u.protocol==='https:'?u.href:''}catch{return ''}}
function version(title,d){const el=node('section','version');el.append(node('div','tag',title));const sign=node('div','sign');sign.style.setProperty('--accent',/^#[a-f\d]{6}$/i.test(d.accent_color||'')?d.accent_color:'#62caff');const src=logo(d.logo_url||d.features?.branding?.logo_url);if(src){const img=node('img');img.src=src;img.alt='Employer logo';img.onerror=()=>img.remove();sign.append(img)}sign.append(node('h2','',d.name||'Employer'));sign.append(node('p','',d.tagline||d.features?.branding?.tagline||''));el.append(sign);el.append(node('p','',d.description||'No description'));el.append(node('p','muted','Recruiter: '+(d.recruiter_name||'Not specified')));return el}
async function load(){if(busy)return;const {data:{user}}=await sb.auth.getUser();$('signin').style.display=user?'none':'block';if(!user){$('queue').replaceChildren();say('Sign in to review employer booth submissions.');return}
const {data:staff,error:se}=await sb.rpc('expo_is_staff');if(se||staff!==true){$('queue').replaceChildren();say('This account does not have Expo staff permissions.');return}
const {data:drafts,error}=await sb.from('expo_booth_branding_drafts').select('*').eq('status','submitted').order('updated_at',{ascending:true});if(error){say('Unable to load queue: '+error.message);return}
const queue=$('queue');queue.replaceChildren();if(!drafts?.length){queue.append(node('p','empty','No booth customization requests are awaiting review.'));say('Review queue is up to date.');return}
const ids=drafts.map(d=>d.employer_id);const {data:employers,error:ee}=await sb.from('expo_employers').select('id,name,description,accent_color,recruiter_name,features,setup_status,booth_number').in('id',ids);if(ee){say('Could not load published booths: '+ee.message);return}const map=new Map((employers||[]).map(e=>[e.id,e]));for(const d of drafts){const e=map.get(d.employer_id);if(!e)continue;const card=node('article','card');card.append(node('h2','',e.name+' · Booth '+e.booth_number));card.append(node('p','muted','Submitted: '+new Date(d.updated_at).toLocaleString()));const cols=node('div','cols');cols.append(version('CURRENTLY PUBLISHED',e),version('SUBMITTED FOR APPROVAL',d));card.append(cols);const note=node('textarea');note.placeholder='Optional feedback if returning for changes';note.maxLength=1000;note.setAttribute('aria-label','Feedback to employer');card.append(note);const actions=node('div','actions');const approve=node('button','', 'Approve and publish');const reject=node('button','secondary','Return for changes');const status=node('p','status');async function review(action){if(busy)return;if(action==='approve'&&!confirm('Publish this new branding to the live Expo booth?'))return;busy=true;approve.disabled=reject.disabled=true;status.textContent='Processing '+action+'…';const {error}=await sb.rpc('expo_review_booth_branding',{p_employer_id:d.employer_id,p_action:action,p_note:note.value});busy=false;if(error){status.textContent='Review failed: '+error.message;approve.disabled=reject.disabled=false;return}say(action==='approve'?'Branding approved and published.':'Draft returned for changes.');await load()}approve.onclick=()=>review('approve');reject.onclick=()=>review('return');actions.append(approve,reject);card.append(actions,status);queue.append(card)}say(drafts.length+' submission(s) awaiting staff review.')}
$('login').onclick=async()=>{const email=$('email').value.trim();if(!email){say('Enter your staff email.');return}const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:new URL('review.html',location.href).href}});say(error?'Sign-in failed: '+error.message:'Check your email for the secure sign-in link.')};$('refresh').onclick=load;sb.auth.onAuthStateChange(()=>setTimeout(load,0));load();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071126">
  <title>Level Up • Career Quest • Electrician</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071126}
    body.qa-mode{display:grid;grid-template-rows:auto 1fr}
    iframe{display:block;width:100%;height:100%;border:0;background:#071126}
    .qa-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px;background:#4b2d09;border-bottom:1px solid #f1b85c;color:#fff;font:13px Inter,system-ui,sans-serif}
    .qa-banner strong{color:#ffd793}.qa-banner a{color:#fff;background:#8a5717;border:1px solid #ffd793;border-radius:999px;padding:7px 11px;text-decoration:none;font-weight:800;white-space:nowrap}
  </style>
  <script src="../../../career-tree-auth-gate.js?v=20261013-ctauth1"></script>
  <script>
  (()=>{
    'use strict';
    const params=new URLSearchParams(location.search);
    const qa=params.get('qa')==='day6';
    window.__ELECTRICIAN_QA__=qa;
    const CORE='career-quest-electrician-days123-v1';
    const BACKUP='career-quest-electrician-qa-backup-v1';
    const read=(key)=>{try{return JSON.parse(localStorage.getItem(key)||'null')}catch{return null}};
    if(qa){
      const current=read(CORE)||{day:1,step:0,runtime:{day:1,phase:0},stats:[0,0,0],discoveries:[],flags:{},history:[],seenCinematics:{},questions:{}};
      let protectedSave=read(BACKUP);
      if(!protectedSave){
        protectedSave=JSON.parse(JSON.stringify(current));
        localStorage.setItem(BACKUP,JSON.stringify(protectedSave));
      }
      const test=JSON.parse(JSON.stringify(protectedSave));
      test.flags=test.flags&&typeof test.flags==='object'?test.flags:{};
      test.flags.direction=test.flags.direction||'Continue';
      test.runtime={day:6,phase:0};
      test.day=6;
      test.step=0;
      test.shiftDays=Array.isArray(test.shiftDays)?test.shiftDays.filter(x=>Number(x?.day)<6):[];
      for(const d of [4,5]){
        if(!test.shiftDays.some(x=>Number(x?.day)===d&&x?.completed)){
          test.shiftDays.push({day:d,completed:true,paidHours:8,qaPrerequisite:true,title:d===4?'Receiving the Delivery':'Tools & Workbench'});
        }
      }
      if(test.nativeMissionResults&&typeof test.nativeMissionResults==='object')for(const d of ['6','7','8','9','10'])delete test.nativeMissionResults[d];
      if(test.life&&typeof test.life==='object'){
        test.life.results=Array.isArray(test.life.results)?test.life.results.filter(x=>Number(x?.day)<6):[];
        test.life.events=Array.isArray(test.life.events)?test.life.events.filter(x=>Number(x?.day)<6):[];
      }
      delete test.completedAt;
      delete test.complete;
      test.qaMode={active:true,startDay:6,startedAt:new Date().toISOString(),source:'protected-backup'};
      localStorage.setItem(CORE,JSON.stringify(test));
      sessionStorage.setItem('career-quest-electrician-qa-active','1');
    }else{
      const backup=localStorage.getItem(BACKUP);
      if(backup){
        try{JSON.parse(backup);localStorage.setItem(CORE,backup);localStorage.removeItem(BACKUP);sessionStorage.removeItem('career-quest-electrician-qa-active')}catch{}
      }
    }
  })();
  </script>
  <script src="native-progress-migration.js?v=20261016-native-migrate1"></script>
</head>
<body>
  <div id="qaBanner" class="qa-banner" hidden><div><strong>QA MODE</strong> • Fresh Day 6–10 test built from your protected participant backup. Cloud progress sync is disabled for this session.</div><a href="./">Exit QA &amp; Restore</a></div>
  <iframe id="experience" src="../../../career-skill-tree/career-quest/electrician/" title="Career Quest: Electrician"></iframe>
  <script>
  (()=>{
    const qa=Boolean(window.__ELECTRICIAN_QA__);
    if(qa){document.body.classList.add('qa-mode');document.getElementById('qaBanner').hidden=false;return;}
    const scripts=[
      '../../../offline-progress.js?v=20261013-ctsync1',
      '../../../career-tree-sync.js?v=20261013-ctsync1',
      'module-progress-sync.js?v=20261013-quest1',
      'day1-3-shift-summary.js?v=20261016-day13a',
      'day4-day5-transition-fix.js?v=20261016-day45a',
      'day5-cleanup.js?v=20261016-day5clean1'
    ];
    for(const src of scripts){const s=document.createElement('script');s.src=src;s.async=false;document.body.appendChild(s)}
  })();
  </script>
</body>
</html>

name: Deploy Level Up Portal

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand Opportunity City assets
        run: |
          mkdir -p public/opportunity-city
          if [ -f public/opportunity-city/opportunity-city-source-a.zip ]; then
            unzip -o public/opportunity-city/opportunity-city-source-a.zip -d public/opportunity-city
          fi
          if [ -f public/opportunity-city/opportunity-city-source-b.zip ]; then
            unzip -o public/opportunity-city/opportunity-city-source-b.zip -d public/opportunity-city
          fi
          rm -f public/opportunity-city/opportunity-city-source-a.zip public/opportunity-city/opportunity-city-source-b.zip

      - name: Expand Money Moves source packages
        run: |
          if [ -f public/money-moves/money-moves-source-a.zip ]; then
            unzip -o public/money-moves/money-moves-source-a.zip -d public/money-moves
          fi
          if [ -f public/money-moves/money-moves-source-b.zip ]; then
            unzip -o public/money-moves/money-moves-source-b.zip -d public/money-moves
          fi
          rm -f public/money-moves/money-moves-source-a.zip public/money-moves/money-moves-source-b.zip

      - name: Inject Money Moves offline runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('public/money-moves/index.html')
          if p.exists():
              s=p.read_text()
              if 'money-moves-gold-v1.css' not in s:
                  s=s.replace('</head>', '<link rel="stylesheet" href="money-moves-gold-v1.css"></head>')
              if '../offline-progress.js' not in s:
                  s=s.replace('</body>', '<script defer src="../offline-client.js"></script><script defer src="../offline-progress.js"></script></body>')
              if 'money-moves-gold-v1.js' not in s:
                  s=s.replace('</body>', '<script src="money-moves-gold-v1.js"></script></body>')
              p.write_text(s)

          app=Path('public/money-moves/app.js')
          if app.exists():
              s=app.read_text()
              old="function localSave(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(snapshot()))}catch{}}"
              new="function localSave(){try{const snap=snapshot();localStorage.setItem(LOCAL_KEY,JSON.stringify(snap));window.LevelUpOfflineProgress?.save('money-moves',snap,{xp:snap.xp,isComplete:snap.finished,completedAt:snap.finished?new Date().toISOString():null})}catch{}}"
              if old not in s:
                  raise SystemExit('Money Moves localSave signature changed; offline queue patch not applied')
              s=s.replace(old,new,1)

              # Scene 16 completion must respond immediately. Commit the final
              # reflection locally first, render the completion summary, then
              # let cloud synchronization continue in the background.
              old_finish="""$('#finishModule').onclick=()=>{const custom=$('#ownMove').value.trim();const move=custom||selected;if(!move){$('#calcOut').insertAdjacentHTML('beforeend','<div class="result warn">Choose or write one money move for this week.</div>');return}state.moneyMove=move;state.finished=true;award('calculator',125);persist(true);showCompletionSummary()}}"""
              new_finish="""$('#finishModule').onclick=()=>{const finishBtn=$('#finishModule');if(finishBtn?.disabled)return;const custom=$('#ownMove').value.trim();const move=custom||selected;if(!move){$('#calcOut').insertAdjacentHTML('beforeend','<div class="result warn">Choose or write one money move for this week.</div>');return}finishBtn.disabled=true;finishBtn.textContent='Completing Money Moves…';state.moneyMove=move;state.finished=true;if(!state.done.has('calculator')){state.done.add('calculator');state.xp+=125}localSave();hud();renderHotspots();showCompletionSummary();persist(true)}}"""
              if old_finish not in s:
                  raise SystemExit('Money Moves Scene 16 completion signature changed; immediate-completion patch not applied')
              s=s.replace(old_finish,new_finish,1)
              app.write_text(s)

          sync=Path('public/money-moves/supabase-sync.js')
          if sync.exists():
              text=sync.read_text()
              if 'LevelUpOfflineProgress?.save(MODULE_ID' not in text:
                  needle="      const s = await session();\n      if(!s) return { signedIn:false };\n      const now = new Date().toISOString();\n      const finished = Boolean(complete || state?.finished);"
                  replacement="      const now = new Date().toISOString();\n      const finished = Boolean(complete || state?.finished);\n      window.LevelUpOfflineProgress?.save(MODULE_ID,state||{},{xp:Number(state?.xp||0),isComplete:finished,completedAt:finished?now:null,updatedAt:now});\n      const s = await session();\n      if(!s) return { signedIn:false };"
                  if needle not in text:
                      raise SystemExit('Money Moves cloud helper signature changed; offline patch not applied')
                  text=text.replace(needle,replacement,1)
              if 'LevelUpOfflineProgress?.markSynced(MODULE_ID)' not in text:
                  needle="      if(error) throw error;\n      return { signedIn:true };"
                  replacement="      if(error) throw error;\n      window.LevelUpOfflineProgress?.markSynced(MODULE_ID);\n      return { signedIn:true };"
                  if needle not in text:
                      raise SystemExit('Money Moves sync completion signature changed; offline patch not applied')
                  text=text.replace(needle,replacement,1)
              sync.write_text(text)
          PY

      - name: Expand First Day Challenge narration media
        run: |
          mkdir -p public/first-day-challenge/assets/media
          if [ -f public/first-day-challenge/fdc-narration-media-a.zip ]; then
            unzip -o public/first-day-challenge/fdc-narration-media-a.zip -d public/first-day-challenge/assets/media
          fi
          if [ -f public/first-day-challenge/fdc-narration-media-b.zip ]; then
            unzip -o public/first-day-challenge/fdc-narration-media-b.zip -d public/first-day-challenge/assets/media
          fi
          rm -f public/first-day-challenge/fdc-narration-media-a.zip public/first-day-challenge/fdc-narration-media-b.zip

      - name: Verify First Day Challenge narration media
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('public/first-day-challenge/assets/media')
          expected = [root / f'media{i}.mp4' for i in range(1, 22)]
          bad = []
          for path in expected:
              if not path.exists():
                  bad.append(f'{path.name}: missing')
                  continue
              data = path.read_bytes()
              if b'moov' not in data or b'mdat' not in data:
                  bad.append(f'{path.name}: incomplete MP4 container')
          if bad:
              raise SystemExit('First Day Challenge narration media check failed:\n' + '\n'.join(bad))
          print('Verified 21 complete First Day Challenge narration MP4s.')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portal
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify shared offline progress wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              Path("dist/first-day-challenge/app.js"): "LevelUpOfflineProgress",
              Path("dist/shadow-passage/app.js"): "LevelUpOfflineProgress",
              Path("dist/money-moves/app.js"): "LevelUpOfflineProgress",
          }
          missing = []
          for path, marker in checks.items():
              if not path.exists():
                  missing.append(f"{path}: missing")
                  continue
              text = path.read_text(errors="ignore")
              if marker not in text:
                  missing.append(f"{path}: missing {marker}")
          if missing:
              raise SystemExit("Offline progress wiring check failed:\n" + "\n".join(missing))
          print("Verified shared offline progress hooks for core portal modules.")
          PY

      - name: Verify cloud helper syntax
        run: |
          node --check dist/shadow-passage/supabase-sync.js
          node --check dist/money-moves/supabase-sync.js
          node --check dist/money-moves/money-moves-gold-v1.js
          node --check dist/money-moves/app.js
          grep -q "money-moves-gold-v1.css" dist/money-moves/index.html
          grep -q "money-moves-gold-v1.js" dist/money-moves/index.html
          grep -q "Completing Money Moves" dist/money-moves/app.js

      - name: Generate offline manifest
        run: node scripts/generate-offline-manifest.mjs dist /Level_Up_Portal/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload portal
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

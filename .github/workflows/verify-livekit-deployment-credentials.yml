name: Verify LiveKit Deployment Credentials
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate with LiveKit without deploying
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          python - <<'PY'
          import os, base64, json, hmac, hashlib, time, urllib.request, urllib.error
          for name in ("LIVEKIT_URL","LIVEKIT_API_KEY","LIVEKIT_API_SECRET"):
              if not os.getenv(name):
                  raise SystemExit("FAIL: "+name+" is missing")
          url=os.environ["LIVEKIT_URL"].replace("wss://","https://").replace("ws://","http://").rstrip("/")
          now=int(time.time())
          def enc(v):
              return base64.urlsafe_b64encode(json.dumps(v,separators=(",",":")).encode()).rstrip(b"=")
          h=enc({"alg":"HS256","typ":"JWT"})
          p=enc({"iss":os.environ["LIVEKIT_API_KEY"],"sub":os.environ["LIVEKIT_API_KEY"],"iat":now,"nbf":now,"exp":now+120,"video":{"roomList":True}})
          unsigned=h+b"."+p
          sig=base64.urlsafe_b64encode(hmac.new(os.environ["LIVEKIT_API_SECRET"].encode(),unsigned,hashlib.sha256).digest()).rstrip(b"=")
          req=urllib.request.Request(url+"/twirp/livekit.RoomService/ListRooms",data=b"{}",headers={"Authorization":"Bearer "+(unsigned+b"."+sig).decode(),"Content-Type":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=15) as response:
                  status=response.status
                  response.read(300)
          except urllib.error.HTTPError as e:
              status=e.code
              e.read(300)
          except Exception as e:
              raise SystemExit("FAIL: Cannot reach LiveKit ("+type(e).__name__+")")
          if status==200:
              print("PASS: GitHub API key and secret authenticate to configured LiveKit project.")
          else:
              raise SystemExit("FAIL: LiveKit returned HTTP "+str(status)+". Check that key, secret, and project URL belong together.")
          PY

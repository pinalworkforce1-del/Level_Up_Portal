name: Deploy Interview Intelligence Pilot

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: live-interview-pilot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy isolated LiveKit agent
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Level Up source
        uses: actions/checkout@v4

      - name: Check deployment credentials
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: ${{ secrets.LIVEKIT_AGENT_SECRET_LIST }}
          SECRET_INTERVIEW_CALLBACK_SECRET: ${{ secrets.INTERVIEW_CALLBACK_SECRET }}
        run: |
          test -n "$LIVEKIT_URL" || { echo "::error::Missing LIVEKIT_URL secret"; exit 1; }
          test -n "$LIVEKIT_API_KEY" || { echo "::error::Missing LIVEKIT_API_KEY secret"; exit 1; }
          test -n "$LIVEKIT_API_SECRET" || { echo "::error::Missing LIVEKIT_API_SECRET secret"; exit 1; }
          test -n "$SECRET_LIST" || { echo "::error::Missing LIVEKIT_AGENT_SECRET_LIST secret (include SYNTHESIA_API_KEY)"; exit 1; }
          test -n "$SECRET_INTERVIEW_CALLBACK_SECRET" || { echo "::error::Missing INTERVIEW_CALLBACK_SECRET GitHub secret"; exit 1; }
          echo "Required secret settings are present (values not printed)."

      - name: Validate interview agent Python syntax
        run: python -m py_compile live-interview-pilot/agent.py

      - name: Create LiveKit interview pilot agent
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: ${{ format('{0},INTERVIEW_CALLBACK_SECRET={1}', secrets.LIVEKIT_AGENT_SECRET_LIST, secrets.INTERVIEW_CALLBACK_SECRET) }}
          SECRET_INTERVIEW_CALLBACK_SECRET: ${{ secrets.INTERVIEW_CALLBACK_SECRET }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: live-interview-pilot

      - name: Confirm agent is running
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        with:
          OPERATION: status-retry
          WORKING_DIRECTORY: live-interview-pilot
          TIMEOUT: 5m

      - name: Verify LiveKit project credentials
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          python - <<'PY'
          import os, base64, json, hmac, hashlib, time, urllib.request, urllib.error, urllib.parse
          url=os.environ['LIVEKIT_URL'].replace('wss://','https://').replace('ws://','http://').rstrip('/')
          now=int(time.time())
          def enc(data):
              return base64.urlsafe_b64encode(json.dumps(data,separators=(',',':')).encode()).rstrip(b'=')
          header=enc({'alg':'HS256','typ':'JWT'})
          payload=enc({'iss':os.environ['LIVEKIT_API_KEY'],'sub':os.environ['LIVEKIT_API_KEY'],'iat':now,'nbf':now,'exp':now+120,'video':{'roomList':True}})
          unsigned=header+b'.'+payload
          signature=base64.urlsafe_b64encode(hmac.new(os.environ['LIVEKIT_API_SECRET'].encode(),unsigned,hashlib.sha256).digest()).rstrip(b'=')
          req=urllib.request.Request(url+'/twirp/livekit.RoomService/ListRooms',data=b'{}',headers={'Authorization':'Bearer '+(unsigned+b'.'+signature).decode(),'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=15) as result:
                  status=result.status
                  result.read(500)
          except urllib.error.HTTPError as e:
              status=e.code
              e.read(500)
          if status == 200:
              print('PASS: LiveKit accepts configured key and secret for this project.')
          else:
              raise SystemExit('FAIL: LiveKit credential verification returned HTTP '+str(status))
          PY

      - name: Verify dedicated callback signing when available
        env:
          INTERVIEW_CALLBACK_SECRET: ${{ secrets.INTERVIEW_CALLBACK_SECRET }}
        run: |
          if [ -z "$INTERVIEW_CALLBACK_SECRET" ]; then
            echo "SKIPPED: Callback secret is managed in LiveKit and Supabase, not GitHub Actions."
            echo "Deployment success does not verify transcript callback authentication."
            exit 0
          fi
          python - <<'PY'
          import hashlib, hmac, json, os, time, urllib.error, urllib.request
          secret = os.environ["INTERVIEW_CALLBACK_SECRET"]
          body = json.dumps({"event":"interview_transcript","room_name":"diagnostic-invalid-room","answers":[],"turns":[]},separators=(",",":")).encode()
          ts = str(int(time.time()))
          signature = hmac.new(secret.encode(),ts.encode()+b"."+body,hashlib.sha256).hexdigest()
          request = urllib.request.Request("https://dnijrzotfyvmmnmueknk.supabase.co/functions/v1/levelup-interview-agent-complete",data=body,method="POST",headers={"Content-Type":"application/json","x-agent-timestamp":ts,"x-agent-signature":signature})
          try:
              with urllib.request.urlopen(request,timeout=15) as response:
                  status, payload = response.status,response.read(300).decode()
          except urllib.error.HTTPError as error:
              status, payload = error.code,error.read(300).decode()
          if status == 400 and "invalid_request" in payload:
              print("PASS: Supabase accepted the signed request and rejected the nonexistent diagnostic room.")
          elif status == 401:
              raise SystemExit("FAIL: Supabase rejected dedicated callback signature (401).")
          else:
              raise SystemExit(f"Unexpected response: HTTP {status}, {payload[:120]}")
          PY

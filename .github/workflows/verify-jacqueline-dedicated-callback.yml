name: Verify Jacqueline Dedicated Callback
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify callback signature without interview
        env:
          INTERVIEW_CALLBACK_SECRET: ${{ secrets.INTERVIEW_CALLBACK_SECRET }}
        run: |
          python - <<'PY'
          import os,hashlib,hmac,json,time,urllib.request,urllib.error
          secret=os.getenv("INTERVIEW_CALLBACK_SECRET","")
          if not secret:
              raise SystemExit("MISSING_SECRET: Configure INTERVIEW_CALLBACK_SECRET in GitHub Actions repository secrets first.")
          body=json.dumps({"event":"interview_transcript","room_name":"diagnostic-invalid-room","answers":[],"turns":[]},separators=(",",":")).encode()
          ts=str(int(time.time()))
          sig=hmac.new(secret.encode(),ts.encode()+b"."+body,hashlib.sha256).hexdigest()
          request=urllib.request.Request("https://dnijrzotfyvmmnmueknk.supabase.co/functions/v1/levelup-interview-agent-complete",data=body,method="POST",headers={"Content-Type":"application/json","x-agent-timestamp":ts,"x-agent-signature":sig})
          try:
              with urllib.request.urlopen(request,timeout=15) as r:
                  status,payload=r.status,r.read(300).decode()
          except urllib.error.HTTPError as e:
              status,payload=e.code,e.read(300).decode()
          if status==400 and "invalid_request" in payload:
              print("PASS: Dedicated callback signature accepted; nonexistent room rejected safely.")
          elif status==401:
              raise SystemExit("FAIL: Supabase rejected the dedicated callback signature (HTTP 401).")
          else:
              raise SystemExit("FAIL: Unexpected HTTP "+str(status)+"; response "+payload[:120])
          PY
